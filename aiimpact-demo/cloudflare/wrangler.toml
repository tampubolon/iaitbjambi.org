# Stated explicitly so wrangler never needs Account:Read on the credential
# it is given. Not a secret -- it appears in dashboard URLs.
account_id = "f74c9c41498ed3c83c89cb8b671c9e2a"

name = "aimpact"
main = "src/index.ts"
compatibility_date = "2026-09-01"

# The builder UI. Served at aimpact.<domain>; index.ts routes by hostname.
[assets]
directory = "./web"
binding = "ASSETS"

[vars]
DOMAIN = "iaitbjambi.org"
MAX_GENERATIONS = "15"
ANTHROPIC_MODEL = "claude-opus-5"

# Secrets, set with `wrangler secret put <NAME>`, never in this file:
#   ANTHROPIC_API_KEY
#   SESSION_SECRET

[[d1_databases]]
binding       = "DB"
database_name = "aimpact"
database_id   = "04fcb4af-48b9-4425-a7ad-487569fe01a3"

[[queues.producers]]
binding = "QUEUE"
queue   = "aimpact-generate"

# max_concurrency is the throttle that keeps a 200-person burst from becoming
# a wall of 429s from Anthropic. It replaces the Lambda reserved-concurrency
# setting in the AWS variant, and is the number to tune once the account's
# rate-limit tier is known.
[[queues.consumers]]
queue               = "aimpact-generate"
max_batch_size      = 1
max_concurrency     = 8
max_retries         = 3
dead_letter_queue   = "aimpact-generate-dlq"
max_batch_timeout   = 0

# Served from workers.dev until the zone moves to Cloudflare. The whole flow
# is exercisable here -- /p/{slug} stands in for the wildcard subdomains that
# workers.dev cannot provide -- so the DNS migration stays the last step
# rather than a prerequisite for testing.
workers_dev = true

# Uncomment once iaitbjambi.org is on Cloudflare and a proxied wildcard "*"
# record exists. Workers routes only apply to proxied hostnames, which is why
# the grey-clouded apex and www stay on Hostinger untouched.
#
# [[routes]]
# pattern   = "aimpact.iaitbjambi.org/*"
# zone_name = "iaitbjambi.org"
#
# [[routes]]
# pattern   = "*.iaitbjambi.org/*"
# zone_name = "iaitbjambi.org"

[observability]
enabled = true

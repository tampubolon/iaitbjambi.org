# Stated explicitly so wrangler never needs Account:Read on the credential
# it is given. Not a secret -- it appears in dashboard URLs.
account_id = "f74c9c41498ed3c83c89cb8b671c9e2a"

name = "aimpact"
main = "src/index.ts"
compatibility_date = "2026-08-22"

# Must sit above every [table]: TOML folds a bare key into whichever table
# precedes it, and this one silently became part of [[queues.consumers]].
# Kept alongside the custom routes as a fallback URL if the zone misbehaves.
workers_dev = true

# The builder UI. Served at aimpact.<domain>; index.ts routes by hostname.
[assets]
directory = "./web"
binding = "ASSETS"
# Without this, static assets are served BEFORE the Worker runs for any path
# that matches a file -- so "/" returned the builder UI on every hostname and
# index.ts never got to route by host. A participant's own subdomain showed
# the code-entry screen instead of their page.
run_worker_first = true

[vars]
DOMAIN = "iaitbjambi.org"
MAX_GENERATIONS = "15"
ANTHROPIC_MODEL = "claude-haiku-4-5"

# Secrets, set with `wrangler secret put <NAME>`, never in this file:
#   ANTHROPIC_API_KEY
#   SESSION_SECRET

[[d1_databases]]
binding       = "DB"
database_name = "aimpact"
database_id   = "04fcb4af-48b9-4425-a7ad-487569fe01a3"

[[queues.producers]]
binding = "QUEUE"
queue   = "aimpact-generate"

[[queues.consumers]]
queue               = "aimpact-generate"
max_batch_size      = 1

# max_concurrency is the throttle that keeps a 200-person burst from becoming
# a wall of 429s from Anthropic.
#
# Set from measurement. Measured 2026-09-10, Haiku 4.5, three real
# generations: mean 1,939 output tokens each, ~16s end to end. The binding
# limit is output tokens at 80,000/min; requests (1,000/min) and input
# (500,000/min) are never close.
#
# Counter-intuitively this is LOWER than the 12 used for Opus 5: Haiku
# finishes in half the time, so each concurrent slot produces tokens twice as
# fast and fewer slots reach the same ceiling. Re-run measure.py after any
# model or prompt change.
#
# Confirmed against real bursts on 2026-09-10 (20, 50 and 100 jobs fired
# simultaneously; 170/170 succeeded, no 429s). Two things the arithmetic
# alone did not show:
#
#   - Queues does not start at max_concurrency. It ramps from 1 over roughly
#     90-105s, which Cloudflare's own consumer metric confirms by reaching
#     exactly 9.00 partway through the 50-job run. Bursts that drain before
#     then never reach full speed: the 20-job run peaked at 5.17 and read
#     12.5 gen/min, the 100-job run held ~31 gen/min once warm. Short tests
#     understate throughput; prewarm.py buys part of the ramp back.
#   - Steady state at 9 is ~31 gen/min (~60,000 out tok/min, 75% of limit),
#     so there is room above it.
#
#  11 concurrent -> ~38 gen/min -> ~74,000 out tok/min (~92% of limit)
#                -> 200 queued jobs drain in ~5 min once warm
#
# 11 is the ceiling this config will accept (check-config.mjs enforces it).
# Above that the queue outruns the rate limit and 429s start; the retry and
# dead-letter path handles those, but a demo should not be relying on it.
max_concurrency     = 11
max_retries         = 3
dead_letter_queue   = "aimpact-generate-dlq"
max_batch_timeout   = 0


# The dead-letter queue must be consumed, not merely declared. Without this
# a job that fails three times lands here and stops: its row stays "running"
# forever, so the participant polls for ten minutes before being told to see
# the panitia, and nothing anywhere records why.
[[queues.consumers]]
queue             = "aimpact-generate-dlq"
max_batch_size    = 10
max_concurrency   = 1
max_retries       = 0
max_batch_timeout = 5

# Workers routes only attach to proxied hostnames. aimpact and * are proxied;
# the apex and www are deliberately grey-clouded, so the existing Hostinger
# site and the mailbox are untouched by these routes.
[[routes]]
pattern   = "aimpact.iaitbjambi.org/*"
zone_name = "iaitbjambi.org"

[[routes]]
pattern   = "*.iaitbjambi.org/*"
zone_name = "iaitbjambi.org"

[observability]
enabled = true
